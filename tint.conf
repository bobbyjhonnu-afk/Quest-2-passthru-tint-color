# Quest 1 Passthrough Colorizer
ENABLED=1

# Tint colour. The sampled luminance is multiplied by this colour.
#   #66CCFF  ice blue       #FFB347  amber
#   #55FF88  night vision   #FF6699  pink
TINT_COLOR=#66CCFF

# How far towards the colour. 0.0 = untouched grey, 1.0 = full tint.
STRENGTH=1.0

# Gain applied after the tint. Values above 1.0 will clip.
BRIGHTNESS=1.0
